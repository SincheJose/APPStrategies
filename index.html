 const pg=PAGES.find(p=>p[0]===state.page)[1];let sub='';if(state.page==='clients'&&state.clientId)sub=client(state.clientId)?.name;if((state.page==='assessments'||state.page==='reviews')&&state.aid)sub=asmt(state.aid)?.title;$('#crumb').innerHTML=`${esc(db.settings.firm)} / <b>${esc(pg)}</b>${sub?' / '+esc(sub):''}`}
function render(quiet){const app=$('#app');let html;try{html=`<div class="view">${VIEWS[state.page]()}</div>`}catch(err){console.error(err);html=`<div class="panel empty"><b>Something went wrong rendering this view.</b>${esc(err.message)}<div class="actions" style="justify-content:center"><button class="btn" data-act="go" data-p="dashboard">Back to dashboard</button></div></div>`}
 document.body.classList.toggle('quiet',!!quiet);app.innerHTML=html;nav();post(quiet);state.pulse=null}
function post(quiet){const inst=quiet||RM;
 $$('.rg').forEach(c=>{if(inst){c.style.transition='none';c.style.strokeDashoffset=c.dataset.off}else requestAnimationFrame(()=>requestAnimationFrame(()=>c.style.strokeDashoffset=c.dataset.off))});
 $$('.bar i[data-w],.rail .fill').forEach(b=>{const w=b.dataset.w+'%';if(inst){b.style.transition='none';b.style.width=w}else requestAnimationFrame(()=>requestAnimationFrame(()=>b.style.width=w))});
 $$('.count').forEach(el=>{const n=parseFloat(el.dataset.n);if(isNaN(n))return;const f=v=>el.dataset.fmt==='signed'?(v>0?'+':'')+Math.round(v):Math.round(v).toLocaleString('en-US');if(inst){el.textContent=f(n);return}const t0=performance.now(),D=1000;const step=now=>{const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);el.textContent=f(n*e);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
function go(p,extra={}){state={...state,page:p,clientId:null,aid:null,mode:null,edit:null,...extra};try{if(location.hash.slice(1)!==p)history.replaceState(null,'','#'+p)}catch(e){}render();window.scrollTo({top:0,behavior:RM?'auto':'smooth'})}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3200)}
function modal(title,body,onSave,saveLabel='Save',cls=''){const m=$('#modal');m.innerHTML=`<div class="mback" data-act="mclose"></div><div class="mbox" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h3 style="font-size:19px">${esc(title)}</h3><button class="x" type="button" data-act="mclose" aria-label="Close">×</button></header><form id="mform">${body}<div class="actions">${onSave?`<button class="btn ${cls}" type="submit">${saveLabel}</button>`:''}<button type="button" class="btn ghost" data-act="mclose">${onSave?'Cancel':'Close'}</button></div></form></div>`;m.classList.add('open');$('#mform').onsubmit=e=>{e.preventDefault();if(!onSave)return;const fd=Object.fromEntries(new FormData(e.target));if(onSave(fd,e.target)!==false)closeModal()};setTimeout(()=>$('#mform input:not([type=hidden]),#mform textarea,#mform select')?.focus(),60)}
function closeModal(){$('#modal').classList.remove('open');$('#modal').innerHTML=''}
const confirmBox=(title,text,fn,label='Delete')=>modal(title,`<p class="muted">${text}</p>`,()=>{fn()},label,'bad');
const inp=(n,l,v='',type='text',extra='')=>`<div class="f ${type==='textarea'?'full':''}"><label for="m-${n}">${l}</label>${type==='textarea'?`<textarea id="m-${n}" name="${n}" ${extra}>${esc(v)}</textarea>`:`<input id="m-${n}" name="${n}" type="${type}" value="${esc(v)}" ${extra}>`}</div>`;
const sel=(n,l,opts,v)=>`<div class="f"><label for="m-${n}">${l}</label><select id="m-${n}" name="${n}">${opts.map(o=>Array.isArray(o)?`<option value="${esc(o[0])}" ${o[0]===v?'selected':''}>${esc(o[1])}</option>`:`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;

/* ================= actions ================= */
const cur=()=>asmt(state.aid);
function clientForm(c={}){return `<div class="form">${inp('name','Company name *',c.name,'text','required')}${inp('industry','Industry',c.industry)}${inp('size','Size',c.size,'text','placeholder="e.g. 120 employees"')}${inp('location','Location',c.location)}${inp('website','Website',c.website)}${inp('since','Client since',c.since||today(),'date')}${c.id?'':inp('cname','Primary contact name')+inp('crole','Contact role')+inp('cemail','Contact email','','email')+inp('cphone','Contact phone','','tel')}${inp('notes','Notes',c.notes,'textarea')}</div>`}
function recForm(r={}){const cl=db.clients;return `<div class="form">${r.id?'':sel('clientId','Client',cl.map(c=>[c.id,c.name]),state.planClient!=='all'?state.planClient:cl[0]?.id)}${inp('title','Recommendation *',r.title,'text','required')}${inp('problem','Finding or problem',r.problem)}${inp('impact','Business impact',r.impact,'textarea','style="min-height:60px"')}${inp('action','Recommended action',r.action,'textarea','style="min-height:60px"')}${sel('priority','Priority',['High','Medium','Low'],r.priority||'Medium')}${sel('effort','Estimated effort',['Low','Medium','High'],r.effort||'Medium')}${sel('horizon','Horizon',HZ.map(h=>[h[0],h[1]+' ('+h[2]+')']),r.horizon||'30-90')}${sel('status','Status',RSTAT,r.status||'Not started')}${inp('owner','Responsible party',r.owner)}${inp('due','Target completion date',r.due,'date')}${inp('outcome','Expected outcome',r.outcome)}${inp('measure','Success measurement',r.measure)}${inp('fin','Estimated financial impact (USD)',r.fin,'number','min="0" placeholder="Leave blank unless supportable"')}${inp('finAssumptions','Assumptions behind the estimate',r.finAssumptions,'textarea','style="min-height:60px"')}</div>`}
const ACT={
 go:d=>go(d.p),mclose:closeModal,
 openClient:d=>go('clients',{clientId:d.id,ctab:'overview'}),
 ctab:d=>{state.ctab=d.t;render(true)},
 newClient:()=>modal('New client',clientForm(),f=>{const c={id:uid('c'),name:f.name.trim(),industry:f.industry,size:f.size,location:f.location,website:f.website,since:f.since,notes:f.notes,contacts:f.cname?[{name:f.cname,role:f.crole,email:f.cemail,phone:f.cphone}]:[],docs:[],services:[]};db.clients.push(c);log(`Client created: ${c.name}`);save();toast('Client created');go('clients',{clientId:c.id,ctab:'overview'})},'Create client'),
 editClient:d=>{const c=client(d.id);modal('Edit client',clientForm(c),f=>{Object.assign(c,{name:f.name.trim(),industry:f.industry,size:f.size,location:f.location,website:f.website,since:f.since,notes:f.notes});log(`Client updated: ${c.name}`);save();render(true);toast('Client updated')})},
 delClient:d=>{const c=client(d.id);confirmBox('Delete client',`Delete <b>${esc(c.name)}</b> and its ${db.assessments.filter(a=>a.clientId===c.id).length} assessments and action items? This cannot be undone.`,()=>{db.assessments=db.assessments.filter(a=>a.clientId!==c.id);db.recs=db.recs.filter(r=>r.clientId!==c.id);db.clients=db.clients.filter(x=>x.id!==c.id);log(`Client deleted: ${c.name}`);save();toast('Client deleted');go('clients')})},
 addContact:d=>modal('Add contact',`<div class="form">${inp('name','Name *','','text','required')}${inp('role','Role')}${inp('email','Email','','email')}${inp('phone','Phone','','tel')}</div>`,f=>{const c=client(d.id);c.contacts=c.contacts||[];c.contacts.push(f);save();render(true)}),
 delContact:d=>{const c=client(d.id);c.contacts.splice(+d.i,1);save();render(true)},
 delDoc:d=>{const c=client(d.id);c.docs.splice(+d.i,1);save();render(true)},
 newAssess:d=>go('assessments',{mode:'new',clientId:d.c||null}),
 reassess:d=>{const c=client(d.id),l=latestScored(c);if(!l)return;const a=newAssessment(c.id,l.templateId,l.templateId==='tpl-fed'?l.title+' — update':'Reassessment — '+new Date().toLocaleDateString('en-US',{month:'short',year:'numeric'}));a.answers=JSON.parse(JSON.stringify(l.answers));a.profile={...l.profile};a.prevId=l.id;save();toast('Reassessment started with previous answers pre-filled');go('assessments',{aid:a.id,mode:'wizard',step:0})},
 openAssess:d=>go('assessments',{aid:d.id,mode:d.m==='view'?null:(asmt(d.id)?.status==='draft'?'wizard':null),step:0}),
 editAssess:d=>go('assessments',{aid:d.id,mode:'wizard',step:0}),
 delAssess:d=>{const a=asmt(d.id);confirmBox('Delete draft',`Delete the draft “${esc(a.title)}”?`,()=>{db.assessments=db.assessments.filter(x=>x.id!==a.id);log(`Draft deleted: ${a.title}`);save();go('assessments')})},
 afilter:d=>{state.afilter=d.f;render(true)},
 wstep:d=>{state.step=+d.n;render(true);const p=$('#wpane');if(p&&!RM){p.classList.remove('wpane');void p.offsetWidth;p.classList.add('wpane')}window.scrollTo({top:0})},
 rate:d=>{const a=cur();const o=a.answers[d.q]||{src:'client'};o.v=+d.v;a.answers[d.q]=o;a.updated=today();save();render(true);const r=$('#catScore');if(r&&!RM){r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash')}},
 src:d=>{const a=cur();const o=a.answers[d.q]||{v:0};o.src=d.s;a.answers[d.q]=o;save();render(true)},
 wsubmit:()=>{const a=cur(),t=tpl(a.templateId),s=score(a);const finish=()=>{submitA(a);save();state.fresh=a.id;$('.overlay')?.remove();toast(`Automated assessment complete — ${a.findings.length} findings raised for expert review`);go('assessments',{aid:a.id,mode:null})};if(RM)return finish();
  const ov=document.createElement('div');ov.className='overlay';ov.innerHTML=`<div class="scan" role="status"><h3>Running automated assessment</h3><ul>${[`Scoring ${s.answered} inputs across ${t.categories.length} categories`,'Weighting categories and measuring completeness','Applying source-confidence factors',`Evaluating ${t.rules.length} template rules`,'Generating findings for expert review'].map(x=>`<li><i></i>${x}</li>`).join('')}</ul><div class="scanbar"><i></i></div></div>`;document.body.appendChild(ov);requestAnimationFrame(()=>requestAnimationFrame(()=>$('.scanbar i',ov).style.width='100%'));$$('li',ov).forEach((li,i)=>setTimeout(()=>li.classList.add('ok'),300+i*320));setTimeout(finish,2000)},
 openReview:d=>go('reviews',{aid:d.id}),
 decide:d=>{const a=cur();if(d.s==='validated')return setItem(a,d.id,{state:'validated'});state.edit={id:d.id,s:d.s==='validated-note'?'validated':d.s};render(true);$('#fc-'+d.id)?.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'})},
 cancelEdit:()=>{state.edit=null;render(true)},
 resetF:d=>{const a=cur(),f=allF(a).find(x=>x.id===d.id);delete a.review.items[d.id];hist(a,`Decision reset to pending: ${f.title}`,rev());save();render(true)},
 addFinding:()=>{const a=cur(),t=tpl(a.templateId);modal('Add expert finding',`<div class="form">${inp('title','Finding *','','text','required')}${sel('cat','Category',t.categories.map(c=>[c.id,c.name]))}${sel('sev','Priority',Object.keys(SEV).map(k=>[k,SEV[k][0]]),'medium')}${inp('detail','Detail and business implication','','textarea')}${inp('action','Recommended action','','textarea','style="min-height:60px"')}</div>`,f=>{a.review.added=a.review.added||[];a.review.added.push({id:uid('fx'),origin:'expert',by:rev(),title:f.title,cat:f.cat,sev:f.sev,detail:f.detail,action:f.action,evidence:[]});if(a.status==='submitted')a.status='in-review';hist(a,`Expert finding added: ${f.title}`,rev());save();render(true);toast('Expert finding added')})},
 delAdded:d=>{const a=cur();const f=a.review.added.find(x=>x.id===d.id);a.review.added=a.review.added.filter(x=>x.id!==d.id);hist(a,`Expert finding removed: ${f.title}`,rev());save();render(true)},
 approve:d=>{const a=asmt(d.id);a.status='approved';a.review.approvedAt=today();a.review.reviewer=rev();a.updated=today();hist(a,'Final assessment approved',rev());save();toast('Assessment approved — ready to generate the action plan');render(true);const p=$('.panel .ring');if(p&&!RM)p.classList.add('flash')},
 reopen:d=>{const a=asmt(d.id);a.status='in-review';a.updated=today();hist(a,'Review reopened',rev());save();render(true)},
 genPlan:d=>{const a=asmt(d.id);const n=genRecs(a);if(n){hist(a,`Action plan generated — ${n} recommendations`,rev());save();toast(`${n} recommendations added to the action plan`)}go('plans',{planClient:a.clientId,planView:'roadmap'})},
 pview:d=>{state.planView=d.v;render(true)},
 editRec:d=>{const r=db.recs.find(x=>x.id===d.id);modal('Edit recommendation',recForm(r)+`<div class="actions" style="margin-top:8px"><button type="button" class="btn bad sm" data-act="delRec" data-id="${r.id}">Delete recommendation</button></div>`,f=>{Object.assign(r,f);r.fin=f.fin===''?'':+f.fin;log(`Recommendation updated: ${r.title}`);save();render(true);toast('Recommendation saved')})},
 delRec:d=>{db.recs=db.recs.filter(x=>x.id!==d.id);save();closeModal();render(true);toast('Recommendation deleted')},
 addRec:()=>modal('Add action',recForm(),f=>{db.recs.push({id:uid('r'),...f,fin:f.fin===''?'':+f.fin,assessmentId:null,findingId:null,created:today()});log(`Recommendation added: ${f.title}`);save();render(true);toast('Action added')}),
 openReport:d=>go('reports',{reportId:d.id}),
 print:()=>{let framed=false;try{framed=window.self!==window.top}catch(e){framed=true}if(framed){toast('Printing is blocked inside the Claude viewer. Open the downloaded HTML file in your browser to print or save as PDF.');return}try{window.print()}catch(e){}},
 copyReport:async()=>{try{await navigator.clipboard.writeText($('#report').innerText);toast('Report text copied')}catch(e){toast('Copy was blocked by the browser')}},
 editSvc:d=>{const v=d.id?db.services.find(x=>x.id===d.id):{};modal(d.id?'Edit service':'Add service',`<div class="form">${inp('name','Service name *',v.name,'text','required')}${sel('model','Engagement model',['One-time','Project-based','Recurring'],v.model||'One-time')}${inp('desc','Description',v.desc,'textarea','style="min-height:60px"')}${inp('price','Price',v.price,'text','placeholder="Leave blank until defined"')}${inp('unit','Pricing unit',v.unit,'text','placeholder="e.g. per engagement, per month"')}<div class="f full"><label class="check"><input type="checkbox" name="active" ${v.active!==false?'checked':''}>Active (offered to clients)</label></div></div>${d.id?`<div class="actions"><button type="button" class="btn bad sm" data-act="delSvc" data-id="${v.id}">Delete service</button></div>`:''}`,f=>{const o={name:f.name,model:f.model,desc:f.desc,price:f.price.trim(),unit:f.unit,active:!!f.active};if(d.id)Object.assign(v,o);else db.services.push({id:uid('svc'),...o});log(`Service catalog updated: ${o.name}`);save();render(true)})},
 delSvc:d=>{db.services=db.services.filter(x=>x.id!==d.id);db.clients.forEach(c=>c.services=(c.services||[]).filter(s=>s!==d.id));save();closeModal();render(true)},
 exportData:()=>modal('Export data',`<p class="muted small" style="margin-bottom:8px">Copy this JSON and keep it somewhere safe. Downloads are blocked in some viewers, so the data is shown here.</p><textarea readonly style="min-height:260px;font:12px/1.4 ui-monospace,monospace" id="exp">${esc(JSON.stringify(db,null,1))}</textarea><div class="actions"><button type="button" class="btn" data-act="copyExport">Copy to clipboard</button></div>`,null),
 copyExport:async()=>{try{await navigator.clipboard.writeText($('#exp').value);toast('Data copied')}catch(e){$('#exp').select();toast('Select-all done — press Ctrl/Cmd+C to copy')}},
 importData:()=>modal('Import data',`<p class="muted small" style="margin-bottom:8px">Paste data exported from this platform. It replaces everything currently stored in this browser.</p><textarea name="json" required style="min-height:220px;font:12px/1.4 ui-monospace,monospace"></textarea>`,f=>{try{const d=JSON.parse(f.json);if(d.v!==2||!Array.isArray(d.clients)||!Array.isArray(d.assessments))throw new Error('Not an APP Strategies export');db=d;log('Data imported','Administrator');save();toast('Data imported');go('dashboard')}catch(e){toast('Import failed: '+e.message);return false}},'Replace data','bad'),
 resetData:()=>confirmBox('Reset sample data','Replace all data in this browser with the fictional sample portfolio?',()=>{seed();save();toast('Sample data restored');go('dashboard')},'Reset')};
function setItem(a,id,obj){const f=allF(a).find(x=>x.id===id);a.review.items[id]={...obj,at:new Date().toISOString(),by:rev()};if(a.status==='submitted'){a.status='in-review';hist(a,'Expert review started',rev())}const lbl={validated:'Validated',modified:'Modified',rejected:'Rejected'}[obj.state];hist(a,`${lbl}: ${f.title}${obj.state==='modified'&&obj.title!==f.title?' → '+obj.title:''}${obj.rationale?' — '+obj.rationale:''}`,rev());a.updated=today();save();state.edit=null;state.pulse=id;render(true);toast(`Finding ${lbl.toLowerCase()}`)}
const SUB={
 createA:f=>{const d=Object.fromEntries(new FormData(f));if(!d.clientId){toast('Create a client first');return}const a=newAssessment(d.clientId,d.templateId,d.title.trim()||'Assessment',d.date||today());save();go('assessments',{aid:a.id,mode:'wizard',step:0})},
 decide:f=>{const d=Object.fromEntries(new FormData(f)),a=cur(),s=f.dataset.s;const o={state:s,rationale:(d.rationale||'').trim()};if(s!=='validated'&&!o.rationale){toast('Please document why');return}if(s==='modified'){o.title=d.title.trim();o.sev=d.sev;o.detail=d.detail}setItem(a,f.dataset.id,o)},
 settings:f=>{const d=Object.fromEntries(new FormData(f));Object.assign(db.settings,{reviewer:d.reviewer.trim()||'Expert reviewer',firm:d.firm.trim()||'APP Strategies',rate:+d.rate||0,autoShare:+d.autoShare||0,opsShare:+d.opsShare||0});log('Settings updated','Administrator');save();render(true);toast('Settings saved')}};
const CHG={
 prof:el=>{const a=cur();a.profile[el.name]=el.type==='number'&&el.value!==''?+el.value:el.value;a.updated=today();save()},
 profv:el=>{cur().profileVerified=el.checked;save()},
 qnote:el=>{const a=cur();const o=a.answers[el.dataset.q]||{v:0,src:'client'};o.note=el.value;a.answers[el.dataset.q]=o;save()},
 rsum:el=>{const a=cur();a.review.summary=el.value;if(a.status==='submitted'&&el.value.trim())a.status='in-review';save();render(true)},
 rmis:el=>{cur().review.missing=el.value;save()},
 rrec:el=>{const a=cur();a.review.recommendation=el.value;hist(a,`Overall recommendation set: ${el.value||'none'}`,rev());save()},
 recStatus:el=>{const r=db.recs.find(x=>x.id===el.dataset.id);r.status=el.value;log(`Action “${r.title}” → ${el.value}`);save();render(true);if(el.value==='Complete')toast('Marked complete')},
 planClient:el=>{state.planClient=el.value;render(true)},
 reportPick:el=>{state.reportId=el.value;render()},
 advisory:el=>{const c=client(el.dataset.id);c.advisory=el.checked;log(`${c.name}: ongoing advisory ${el.checked?'started':'ended'}`);save();render(true)},
 clientSvc:el=>{const c=client(el.dataset.id);c.services=c.services||[];if(el.checked)c.services.push(el.dataset.s);else c.services=c.services.filter(s=>s!==el.dataset.s);save()},
 cnotes:el=>{client(el.dataset.id).notes=el.value;save();toast('Notes saved')},
 cdoc:el=>{const c=client(el.dataset.id);c.docs=c.docs||[];[...el.files].forEach(f=>c.docs.push({name:f.name,kind:'Document',added:today()}));log(`${c.name}: ${el.files.length} document name(s) recorded`);save();render(true)},
 tw:el=>{const t=tpl(el.dataset.t),c=t.categories.find(x=>x.id===el.dataset.c);c.weight=Math.max(0,+el.value||0);bump(t,`Weight for ${c.name} set to ${c.weight}`)},
 tth:el=>{const t=tpl(el.dataset.t);t.thresholds[el.dataset.k]=Math.max(0,Math.min(100,+el.value||0));bump(t,`${el.dataset.k} threshold set to ${t.thresholds[el.dataset.k]}`)}};
function bump(t,what){const[M,m]=String(t.version).split('.').map(Number);t.version=`${M}.${(m||0)+1}`;log(`${t.name} v${t.version}: ${what}`,'Administrator');save();toast(`${t.name} is now v${t.version}. Submitted assessments keep their original settings.`);render(true)}

/* ================= events ================= */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(!f)return;if(el.tagName==='BUTTON'||el.tagName==='A')e.preventDefault();f(el.dataset,el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el)});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.in==='search'){state.q=el.value;const pos=el.selectionStart;render(true);const n=$('[data-in=search]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.sub&&SUB[f.dataset.sub]){e.preventDefault();SUB[f.dataset.sub](f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('open'))closeModal()});
const tip=$('#tip');const showTip=t=>{if(!t){tip.classList.remove('show');return}tip.textContent=t.dataset.tip;const r=t.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(innerWidth-268,r.left+r.width/2-130))+'px';tip.style.top=Math.max(40,r.top-8)+'px';tip.classList.add('show')};
document.addEventListener('mouseover',e=>showTip(e.target.closest?.('[data-tip]')));
document.addEventListener('focusin',e=>showTip(e.target.closest?.('[data-tip]')));
document.addEventListener('scroll',()=>tip.classList.remove('show'),{passive:true});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==state.page)go(h)});

load();const h0=location.hash.slice(1);if(VIEWS[h0])state.page=h0;render();
}
</script>
