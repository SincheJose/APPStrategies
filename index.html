<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APP Strategies Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* VOICE: confident advisory instrument — precise, calm, premium
   IDEA: a consultant's diagnostic console: readings in, validated verdicts out
   PICTURE: animated score rings, radar, and the five-stage engagement rail
   COLOUR and TYPE: deep navy field, electric-blue signal; green/amber/red only for status and risk; Space Grotesk + Inter
   LAYOUT: left rail + sticky top bar, glass panels to 1320px; rail becomes a top scroller under 900px */
:root{color-scheme:dark;--bg:#060b16;--glass:rgba(16,26,48,.68);--glass2:rgba(24,38,68,.7);--solid:#0d1630;--line:rgba(140,165,220,.14);--line2:rgba(140,165,220,.28);--ink:#eef2fb;--ink2:#c3cce0;--muted:#8a96b0;--blue:#3b74ff;--elec:#4fb2ff;--glow:rgba(79,178,255,.32);--green:#2ec27e;--amber:#f2ad3d;--red:#ff5d73;--r:14px;--sh:0 12px 40px rgba(0,0,0,.35);--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(38% 32% at 18% 8%,rgba(59,116,255,.20),transparent 70%),radial-gradient(30% 28% at 88% 12%,rgba(79,178,255,.10),transparent 70%),radial-gradient(45% 40% at 70% 98%,rgba(30,64,160,.18),transparent 70%);animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3%,-2%,0) scale(1.05)}}
h1,h2,h3,h4{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em;margin:0;line-height:1.15;font-weight:600}
h1{font-size:clamp(26px,3vw,34px);text-wrap:balance}h2{font-size:18px}h3{font-size:15px}h4{font-size:15px}
p{margin:0}a{color:var(--elec)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--elec);outline-offset:2px}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 14px;display:flex;flex-direction:column;gap:22px;background:linear-gradient(180deg,rgba(9,16,34,.92),rgba(6,11,22,.96));border-right:1px solid var(--line)}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px}
.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--elec));display:grid;place-items:center;font:700 15px "Space Grotesk",Inter,sans-serif;color:#fff;box-shadow:0 6px 20px var(--glow)}
.brand b{font:700 17px "Space Grotesk",Inter,sans-serif;display:block;letter-spacing:-.02em}.brand small{color:var(--muted);font-size:12px}
.nav{display:grid;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--ink2);text-align:left;padding:10px 12px;border-radius:10px;min-height:42px;transition:background .2s,color .2s}
.nav button svg{width:17px;height:17px;flex:none;opacity:.8}
.nav button:hover{background:rgba(79,178,255,.07);color:#fff}
.nav button.on{background:linear-gradient(90deg,rgba(59,116,255,.22),rgba(59,116,255,.05));color:#fff;box-shadow:inset 2px 0 0 var(--elec)}
.nav .badge{margin-left:auto;background:var(--blue);color:#fff;border-radius:99px;font-size:12px;padding:0 7px;line-height:19px}
.model{margin-top:auto;padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);font-size:12.5px;color:var(--muted)}
.model b{color:var(--ink2);display:block;margin-bottom:6px;font-size:13px}
.model ol{margin:0;padding-left:18px;display:grid;gap:2px}
.top{position:sticky;top:0;z-index:5;height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(16px,3vw,36px);background:rgba(6,11,22,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.crumb{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crumb b{color:var(--ink)}
.topr{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.chip{border:1px solid var(--line2);border-radius:99px;padding:3px 10px;font-size:12px;white-space:nowrap}
.chip.warn{border-color:rgba(242,173,61,.4);color:var(--amber)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--glass2);border:1px solid var(--line2);display:grid;place-items:center;font-weight:600;color:var(--ink)}
main{max-width:1320px;margin:0 auto;padding:28px clamp(16px,3vw,36px) 80px}
.view{animation:pagein .45s var(--ease)}
@keyframes pagein{from{opacity:0;transform:translateY(10px)}}
.quiet .view,.quiet .up{animation:none!important}
.up{animation:up .6s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.kick{color:var(--elec);font-size:13px;font-weight:600;margin-bottom:6px}
.sub{color:var(--muted);max-width:720px;margin-top:6px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;border:1px solid transparent;border-radius:10px;padding:8px 15px;background:linear-gradient(180deg,#4a82ff,#2f62e8);color:#fff;font-weight:600;font-size:14px;box-shadow:0 6px 18px rgba(59,116,255,.25);transition:transform .15s,box-shadow .2s,filter .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(59,116,255,.35)}
.btn.ghost{background:rgba(255,255,255,.03);border-color:var(--line2);color:var(--ink);box-shadow:none}
.btn.ghost:hover{background:rgba(79,178,255,.08)}
.btn.ok{background:linear-gradient(180deg,#36cf8a,#1f9e66);box-shadow:0 6px 18px rgba(46,194,126,.22)}
.btn.bad{background:transparent;border-color:rgba(255,93,115,.45);color:var(--red);box-shadow:none}
.btn.warn{background:transparent;border-color:rgba(242,173,61,.45);color:var(--amber);box-shadow:none}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;filter:grayscale(.4)}
.link{background:none;border:0;padding:0;color:var(--elec);font-weight:600;text-align:left}
.link:hover{text-decoration:underline}
.panel,.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh);backdrop-filter:blur(10px)}
.card{transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
.card.hov:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 16px 44px rgba(0,0,0,.45),0 0 0 1px rgba(79,178,255,.12)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ph p{color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.kpi .lab{color:var(--muted);font-size:13px}
.kpi .num{font:600 clamp(26px,2.6vw,34px)/1.1 "Space Grotesk",Inter,sans-serif;margin:8px 0 4px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .foot{font-size:12.5px;color:var(--muted)}
.kpi .num.red{color:var(--red)}.kpi .num.green{color:var(--green)}.kpi .num.amber{color:var(--amber)}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600;background:rgba(255,255,255,.06);color:var(--ink2);white-space:nowrap;border:1px solid transparent}
.pill.red{background:rgba(255,93,115,.12);color:#ff8b9b;border-color:rgba(255,93,115,.25)}
.pill.amber{background:rgba(242,173,61,.12);color:#f6c26c;border-color:rgba(242,173,61,.25)}
.pill.green{background:rgba(46,194,126,.12);color:#5fd9a0;border-color:rgba(46,194,126,.25)}
.pill.blue{background:rgba(79,178,255,.12);color:#86c8ff;border-color:rgba(79,178,255,.25)}
.pill.auto{background:transparent;color:#86c8ff;border:1px dashed rgba(79,178,255,.55)}
.pill.exp{background:rgba(46,194,126,.14);color:#6fe0ab;border:1px solid rgba(46,194,126,.45)}
.bar{height:8px;background:rgba(255,255,255,.06);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--elec));transition:width 1.1s var(--ease)}
.bar i.red{background:linear-gradient(90deg,#d63a52,var(--red))}.bar i.amber{background:linear-gradient(90deg,#d68a17,var(--amber))}.bar i.green{background:linear-gradient(90deg,#1f9e66,var(--green))}
.bar.thin{height:6px}.bar.prev i{background:rgba(200,210,235,.35)}
.ring{position:relative;flex:none}.ring svg{width:100%;height:100%;display:block}
.ring .rbg{fill:none;stroke:rgba(255,255,255,.07)}
.ring .rg{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.3s var(--ease);filter:drop-shadow(0 0 6px var(--glow))}
.ring .rv{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .rv b{font:600 26px/1 "Space Grotesk",Inter,sans-serif;letter-spacing:-.03em}
.ring.sm .rv b{font-size:15px}.ring.md .rv b{font-size:20px}
.ring .rv small{color:var(--muted);font-size:12px;margin-top:3px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12.5px;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .2s}tbody tr:hover{background:rgba(79,178,255,.04)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
/* workflow rail */
.rail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative;margin:6px 0 4px}
.rail::before,.rail .fill{content:"";position:absolute;top:15px;left:10%;right:10%;height:2px;background:var(--line2)}
.rail .fill{background:linear-gradient(90deg,var(--blue),var(--elec));right:auto;width:0;transition:width 1.2s var(--ease);box-shadow:0 0 10px var(--glow)}
.step{display:grid;justify-items:center;gap:7px;text-align:center;position:relative;z-index:1;font-size:12.5px;color:var(--muted)}
.step .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--solid);border:1px solid var(--line2);font:600 13px "Space Grotesk",Inter,sans-serif;transition:all .4s}
.step.done .dot{background:var(--blue);border-color:var(--blue);color:#fff}
.step.cur .dot{background:var(--bg);border:2px solid var(--elec);color:var(--elec);box-shadow:0 0 0 5px rgba(79,178,255,.13),0 0 18px var(--glow)}
.step.cur{color:var(--ink);font-weight:600}.step.done{color:var(--ink2)}
.minirail{display:flex;gap:4px}.minirail i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.08)}.minirail i.on{background:linear-gradient(90deg,var(--blue),var(--elec))}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.lane{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:150px}
.lane h4{font-size:13px;display:flex;justify-content:space-between;color:var(--ink2);margin-bottom:10px}
.lane h4 span{color:var(--muted);font-weight:500}
.cchip{display:block;width:100%;text-align:left;background:var(--glass2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;transition:transform .2s,border-color .2s}
.cchip:hover{transform:translateY(-2px);border-color:rgba(79,178,255,.4)}
.cchip .bar,.contact .bar{flex:1;width:100%}.cchip b{display:block;font-size:13px;font-weight:600}.cchip small{color:var(--muted);font-size:12px}
.op{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px;background:rgba(255,255,255,.02)}
.op div{padding:12px 14px;border-right:1px solid var(--line);font-size:13px;color:var(--muted)}.op div:last-child{border:0}
.op b{display:block;color:var(--ink);font:600 14px "Space Grotesk",Inter,sans-serif}
.catrow{display:grid;grid-template-columns:130px minmax(0,1fr) 44px;gap:12px;align-items:center;font-size:13.5px;padding:6px 0}
.catrow b{text-align:right;font-variant-numeric:tabular-nums}
/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.f{display:grid;gap:6px}.f.full{grid-column:1/-1}
label,.lbl{font-size:13px;font-weight:600;color:var(--ink2)}
input,select,textarea{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line2);border-radius:9px;background:rgba(6,11,22,.6);font-size:15px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--elec);box-shadow:0 0 0 3px rgba(79,178,255,.18)}
textarea{min-height:90px;resize:vertical;line-height:1.5}
input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--blue)}
.check{display:flex;gap:9px;align-items:center;font-size:14px;font-weight:500}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
select option{background:#0d1630}
.search{max-width:300px}
/* wizard */
.wz{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}
.wsteps{display:grid;gap:4px;align-content:start;position:sticky;top:84px}
.wsteps button{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:transparent;color:var(--ink2);border-radius:10px;padding:8px 10px;text-align:left;font-size:13.5px;min-height:40px}
.wsteps button:hover{background:rgba(255,255,255,.04)}
.wsteps button.on{background:var(--glass2);border-color:var(--line2);color:#fff}
.wsteps .sd{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;flex:none}
.wsteps .done .sd{background:var(--green);border-color:var(--green);color:#04130b}
.wsteps .part .sd{border-color:var(--amber);color:var(--amber)}
.wsteps em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted)}
.wpane{animation:slide .45s var(--ease)}
@keyframes slide{from{opacity:0;transform:translateX(18px)}}
.q{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.q:last-child{border:0}
.qt{display:flex;gap:8px;align-items:flex-start;font-weight:600}
.help{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--muted);font-size:12px;display:grid;place-items:center;padding:0}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate button{min-width:44px;min-height:40px;border-radius:9px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-weight:600;transition:all .18s}
.rate button:hover{border-color:var(--elec)}
.rate button.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 3px rgba(59,116,255,.2);transform:scale(1.05)}
.rate button.na{font-weight:500;font-size:13px;padding:0 10px}
.rate button.na.on{background:rgba(255,255,255,.12);border-color:var(--line2);box-shadow:none}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:12.5px;color:var(--muted);min-height:34px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:rgba(79,178,255,.16);color:#fff}
.qrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);max-width:300px}
.flash{animation:flash .9s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(79,178,255,.6);transform:scale(1.06)}100%{box-shadow:0 0 0 18px rgba(79,178,255,0);transform:scale(1)}}
.ring.flash{border-radius:50%}
.wnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(4,8,18,.82);backdrop-filter:blur(8px);display:grid;place-items:center}
.scan{width:min(420px,90vw);padding:28px;border-radius:16px;background:var(--solid);border:1px solid var(--line2);box-shadow:var(--sh)}
.scan h3{margin-bottom:16px}
.scan li{list-style:none;display:flex;gap:10px;align-items:center;padding:7px 0;color:var(--muted);transition:color .3s}
.scan li i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);flex:none;transition:all .3s}
.scan li.ok{color:var(--ink)}.scan li.ok i{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(46,194,126,.5)}
.scan ul{margin:0;padding:0}
.scanbar{height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:14px}.scanbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--elec));transition:width 1.7s linear}
/* findings */
.fd{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:rgba(255,255,255,.02);transition:border-color .3s,background .3s}
.fd.new{animation:newf 2.4s var(--ease) both;animation-delay:calc(var(--i,0)*120ms)}
@keyframes newf{0%{opacity:0;transform:translateY(10px);box-shadow:0 0 0 0 rgba(255,93,115,0)}25%{opacity:1;transform:none;box-shadow:0 0 0 4px rgba(255,93,115,.18),0 0 24px rgba(255,93,115,.2)}100%{box-shadow:0 0 0 0 rgba(255,93,115,0)}}
.fd .fh{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.fd h4{margin-bottom:4px}
.fd p{color:var(--ink2);font-size:14px}
.fd .sev{width:9px;height:9px;border-radius:50%;flex:none}
.sev.high{background:var(--red);box-shadow:0 0 8px var(--red)}.sev.medium{background:var(--amber)}.sev.low{background:var(--elec)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--elec);font-size:13px;font-weight:600;list-style:none;display:inline-flex;gap:6px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .25s}
details[open] summary::before{transform:rotate(45deg)}
details[open]>.dbody{animation:up .35s var(--ease)}
.dbody{margin-top:8px;font-size:13px}
.ev{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.ev:last-child{border:0}
.est{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(79,178,255,.06);border:1px solid rgba(79,178,255,.2);font-size:13px}
.est b{font:600 16px "Space Grotesk",Inter,sans-serif;color:#fff}
.est ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
/* review cards */
.rv-card{border-radius:14px;margin-bottom:14px;background:var(--glass);border:1px solid var(--line);overflow:hidden;transition:border-color .4s,box-shadow .4s}
.rv-card .rvh{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.rv-card .rvh .st{margin-left:auto}
.autob{margin:14px 16px;padding:12px 14px;border:1px dashed rgba(79,178,255,.45);border-radius:10px;background:rgba(79,178,255,.035)}
.autob .tag,.expb .tag{font-size:12px;font-weight:600;color:#86c8ff;display:flex;gap:6px;align-items:center;margin-bottom:6px}
.expb{margin:0 16px 14px;padding:12px 14px;border:1px solid rgba(46,194,126,.45);border-radius:10px;background:rgba(46,194,126,.06);animation:up .4s var(--ease)}
.expb .tag{color:#6fe0ab}
.expb.rej{border-color:rgba(255,93,115,.45);background:rgba(255,93,115,.06)}.expb.rej .tag{color:#ff8b9b}

function score(a){const t=tpl(a.templateId);const cats=t.categories.map(c=>{const rs=c.q.map(q=>a.answers[q.id]||{});const ans=rs.filter(r=>+r.v>0);const s=ans.length?Math.round(ans.reduce((x,r)=>x+ +r.v,0)/(ans.length*5)*100):null;const conf=ans.length?ans.reduce((x,r)=>x+(SRC[r.src||'client']||SRC.client)[2],0)/ans.length:0;return{...c,weight:a.weights?.[c.id]??c.weight,score:s,comp:ans.length/c.q.length,conf,n:ans.length}});
 const sc=cats.filter(c=>c.score!=null&&c.weight>0),ws=sc.reduce((x,c)=>x+c.weight,0);
 const overall=ws?Math.round(sc.reduce((x,c)=>x+c.score*c.weight,0)/ws):null;
 const tq=cats.reduce((x,c)=>x+c.q.length,0),aq=cats.reduce((x,c)=>x+c.n,0);
 const completeness=tq?Math.round(aq/tq*100):0;
 const avgSrc=aq?cats.reduce((x,c)=>x+c.conf*c.n,0)/aq:0;
 const confidence=Math.round(completeness*avgSrc);
 const confLevel=confidence>=70?'High':confidence>=45?'Moderate':'Low';
 const band=overall==null?'Not scored':(t.bands.find(b=>overall>=b[0])||t.bands[t.bands.length-1])[1];
 return{cats,overall,completeness,confidence,confLevel,band,answered:aq,total:tq}}
function estimate(kind,a,c){const p=a.profile||{},S=db.settings;
 if((kind==='auto'||kind==='ops')&&c&&c.score!=null){const emp=+p.employees;if(!emp)return null;const share=(kind==='auto'?S.autoShare:S.opsShare)/100,gap=1-c.score/100,hrs=Math.round(emp*2080*share*gap);
  return{value:hrs*S.rate,label:kind==='auto'?'Estimated annual capacity in automatable work':'Estimated annual capacity lost to inefficiency',assumptions:[`${emp} employees (${a.profileVerified?'verified':'client-provided'})`,'2,080 paid hours per employee per year',`${kind==='auto'?S.autoShare:S.opsShare}% of staff time addressable, scaled by the category gap of ${Math.round(gap*100)}%`,`$${S.rate}/hour loaded labor rate (set in Administration)`,'Represents capacity freed, not guaranteed cash savings']}}
 if(kind==='margin'){const rev=+p.revenue,gm=+p.grossMargin;if(!rev||isNaN(gm))return null;return{value:Math.round(rev*(20-gm)/100),label:'Gross profit gap to the 20% threshold',assumptions:[`Annual revenue of ${money(rev)} (${a.profileVerified?'verified':'client-provided'})`,`Reported gross margin of ${gm}%`,'Gap = revenue × (20% − current margin)','The 20% threshold is a screening rule, not an industry benchmark']}}
 return null}
function genFindings(a,t,cats){const th=a.thresholds||t.thresholds,F=[];
 cats.forEach(c=>{const ev=c.q.map(q=>({q:q.t,v:+(a.answers[q.id]?.v)||0,src:a.answers[q.id]?.src||'client'}));
  if(c.comp<0.67)F.push({id:`f-${c.id}-data`,type:'data',sev:'medium',cat:c.id,title:`Insufficient information: ${c.name}`,detail:`${c.n} of ${c.q.length} inputs were provided. The category score is not reliable until the gaps are filled.`,action:`Collect the missing ${c.name.toLowerCase()} inputs and supporting documents.`,evidence:ev});
  if(c.score!=null&&c.score<=th.medium){const sev=c.score<=th.high?'high':'medium';F.push({id:`f-${c.id}-gap`,type:'gap',sev,cat:c.id,title:`${c.name}: ${sev==='high'?'significant weakness':'improvement needed'}`,detail:`Category score ${c.score}/100. ${c.impact}`,action:c.action,evidence:ev,est:c.est?estimate(c.est,a,c):null})}
  else if(c.score!=null&&c.score>=70&&c.conf<0.6)F.push({id:`f-${c.id}-unv`,type:'unverified',sev:'low',cat:c.id,title:`${c.name}: strength rests on unverified inputs`,detail:'The rating is favorable, but most inputs are assumptions. Confirm before relying on it.',action:'Request documentation that supports these ratings.',evidence:ev})});
 t.rules.forEach(r=>{let x=a.profile?.[r.f],hit=false;if(r.op==='wordsLt'){x=words(x);hit=x<r.v}else{if(x===''||x==null)return;x=+x;if(isNaN(x))return;hit=r.op==='lt'?x<r.v:x>=r.v}

const ICONS={dashboard:'<rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="3" rx="1"/><rect x="9" y="7" width="5" height="7" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/>',clients:'<circle cx="6" cy="5" r="2.5"/><path d="M1.5 14c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5M11 3.2a2.3 2.3 0 010 4.4M12 9.8c1.6.5 2.6 2 2.6 4.2"/>',assessments:'<rect x="3" y="2.5" width="10" height="12" rx="1.5"/><path d="M6 2.5v-1h4v1M5.5 7h5M5.5 9.5h5M5.5 12h3"/>',reviews:'<path d="M8 1.5l5.5 2v4.2c0 3.3-2.3 5.9-5.5 6.8-3.2-.9-5.5-3.5-5.5-6.8V3.5z"/><path d="M5.5 8l1.8 1.8 3.4-3.5"/>',plans:'<circle cx="3.5" cy="12.5" r="1.5"/><circle cx="12.5" cy="3.5" r="1.5"/><path d="M5 12.5h4a2.5 2.5 0 000-5H7a2.5 2.5 0 010-5h4"/>',reports:'<path d="M3.5 1.5h6l3 3v10h-9z"/><path d="M9.5 1.5v3h3M6 12V9M8 12V7M10 12v-2"/>',services:'<path d="M1.5 8.5v-6a1 1 0 011-1h6l6 6-7 7z"/><circle cx="5" cy="5" r="1.2"/>',admin:'<circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/>'};
const PAGES=[['dashboard','Executive Dashboard'],['clients','Clients'],['assessments','Assessments'],['reviews','Expert Reviews'],['plans','Action Plans'],['reports','Reports'],['services','Service Catalog'],['admin','Administration']];
const icon=k=>`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;
const pill=(cls,t,tip)=>`<span class="pill ${cls}"${tip?` data-tip="${esc(tip)}"`:''}>${esc(t)}</span>`;
const sevPill=s=>pill(SEV[s][1],SEV[s][0]+' priority');
const srcPill=s=>pill((SRC[s]||SRC.client)[1],(SRC[s]||SRC.client)[0]);
function ring(v,size=120,stroke=10,label='',cls='',id=''){const r=(size-stroke)/2,C=+(2*Math.PI*r).toFixed(2),off=+(C*(1-(v??0)/100)).toFixed(2);const col=v==null?'rgba(255,255,255,.2)':v>=70?'var(--green)':v>=55?'var(--amber)':'var(--red)';
 return `<div class="ring ${cls}" ${id?`id="${id}"`:''} style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}"><circle class="rbg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/><circle class="rg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" stroke="${col}" stroke-dasharray="${C}" style="stroke-dashoffset:${C}" data-off="${off}" transform="rotate(-90 ${size/2} ${size/2})"/></svg><div class="rv"><b class="count" data-n="${v??''}">${v==null?'—':'0'}</b>${label?`<small>${esc(label)}</small>`:''}</div></div>`}
const bar=(v,cls='',extra='')=>`<div class="bar ${extra}"><i data-w="${Math.max(0,Math.min(100,v||0))}" class="${cls}"></i></div>`;
const count=(n,fmt='')=>`<span class="count" data-n="${n}" data-fmt="${fmt}">0</span>`;
function rail(idx){return `<div class="rail"><div class="fill" data-w="${idx/4*80}"></div>${STAGES.map((s,i)=>`<div class="step ${i<idx?'done':i===idx?'cur':''}"><div class="dot">${i<idx?'✓':'0'+(i+1)}</div><span>${s}</span></div>`).join('')}</div>`}
const minirail=idx=>`<div class="minirail" data-tip="${STAGES[idx]}">${STAGES.map((s,i)=>`<i class="${i<=idx?'on':''}"></i>`).join('')}</div>`;
function radar(cats,prev){const N=cats.length,cx=210,cy=145,R=100;const pt=(i,v)=>{const g=-Math.PI/2+i*2*Math.PI/N;return[+(cx+Math.cos(g)*R*v/100).toFixed(1),+(cy+Math.sin(g)*R*v/100).toFixed(1)]};
 const poly=(vals,cls)=>`<polygon class="${cls}" points="${vals.map((v,i)=>pt(i,v??0).join(',')).join(' ')}"/>`;
 return `<svg class="radar" viewBox="0 0 420 290" role="img" aria-label="Category score radar">${[25,50,75,100].map(l=>poly(cats.map(()=>l),'rgrid')).join('')}${cats.map((c,i)=>{const[x,y]=pt(i,100);return `<line class="raxis" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`}).join('')}${prev?poly(prev,'rprev'):''}${poly(cats.map(c=>c.score),'rshape')}${cats.map((c,i)=>{const[x,y]=pt(i,c.score??0);return `<circle class="rdot" cx="${x}" cy="${y}" r="4" data-tip="${esc(c.name)}: ${c.score??'not scored'}"/>`}).join('')}${cats.map((c,i)=>{const[x,y]=pt(i,118);const an=Math.abs(x-cx)<10?'middle':x>cx?'start':'end';return `<text class="rlabel" x="${x}" y="${y+4}" text-anchor="${an}">${esc(c.short)}</text>`}).join('')}</svg>`}
function compare(cur,prev){return `<div class="legend" style="margin-bottom:8px"><span><i style="background:rgba(200,210,235,.45)"></i>Previous</span><span><i style="background:var(--elec)"></i>Current</span></div>`+cur.map(c=>{const p=prev.find(x=>x.id===c.id)?.score;const d=c.score!=null&&p!=null?c.score-p:null;return `<div class="cmprow"><span>${esc(c.short)}</span><div class="cmpbars">${bar(p,'','thin prev')}${bar(c.score,'','thin')}</div><b class="delta ${d>0?'up':d<0?'down':''}">${d==null?'—':d>0?'▲ +'+d:d<0?'▼ '+d:'0'}</b></div>`}).join('')}
function statusPill(a){const m={draft:['Draft — intake',''],submitted:['Awaiting expert review','amber'],'in-review':['In expert review','blue'],approved:['Expert-approved','green']}[a.status];return pill(m[1],m[0])}
function head(kick,title,sub,btns=''){return `<div class="head up"><div><div class="kick">${kick}</div><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>${btns?`<div class="btns">${btns}</div>`:''}</div>`}
const fmtVal=(f,v)=>v===''||v==null?'—':f.fmt==='money'?money(v):f.fmt==='pct'?v+'%':f.type==='date'?fdate(v):esc(v);

/* ================= views ================= */
function vDashboard(){const C=db.clients,A=db.assessments;const stages=C.map(stageOf);
 const latest=C.map(latestScored).filter(Boolean);
 const high=latest.reduce((n,a)=>n+allF(a).filter(f=>fstate(a,f)!=='rejected'&&eff(a,f).sev==='high').length,0);
 const openR=db.recs.filter(r=>r.status!=='Complete').length;
 const pending=A.filter(a=>a.status==='submitted').length,inrev=A.filter(a=>a.status==='in-review').length,done=A.filter(a=>a.status==='approved').length;
 const deltas=C.map(c=>{const l=latestScored(c);const p=l&&prevOf(l);return l&&p?score(l).overall-score(p).overall:null}).filter(x=>x!=null);
 const imp=deltas.length?Math.round(deltas.reduce((a,b)=>a+b,0)/deltas.length):null;
 const kpis=[['Total clients',C.length,'','Fictional sample portfolio'],['Active engagements',stages.filter(s=>s>=1).length,'','Past intake stage'],['Completed assessments',done,'green','Expert-approved'],['Pending expert reviews',pending,pending?'amber':'','Scored, not yet reviewed'],['High-priority findings',high,high?'red':'','Latest assessment per client'],['Open recommendations',openR,'','Across all action plans'],['Awaiting approval',inrev,'','Review started, not approved'],['Client improvement',imp,imp>0?'green':'',deltas.length?`Avg. score change, ${deltas.length} reassessed client${deltas.length>1?'s':''}`:'No reassessments yet']];
 const biz=latest.filter(a=>a.templateId==='tpl-biz');const bt=tpl('tpl-biz');
 const catAvg=bt.categories.map(c=>{const v=biz.map(a=>score(a).cats.find(x=>x.id===c.id)?.score).filter(x=>x!=null);return{...c,v:v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null}});
 const queue=A.filter(a=>a.status==='submitted'||a.status==='in-review').sort((x,y)=>String(x.submittedAt).localeCompare(String(y.submittedAt)));
 const headline=pending+inrev?`${pending+inrev} assessment${pending+inrev>1?'s':''} waiting on expert judgment`:'Every assessment has been expert-reviewed';
 return head('Executive dashboard',headline,'Software triages. The expert validates. The client acts. Automated scores are screening signals until an expert approves them.',`<button class="btn ghost" data-act="go" data-p="reviews">Open review queue</button><button class="btn" data-act="newAssess">＋ New assessment</button>`)+
 `<div class="op up" style="--i:1"><div><b>Technology identifies</b>Automated scoring &amp; rules</div><div><b>Expert validates</b>Findings confirmed or changed</div><div><b>Strategy guides</b>Prioritized roadmap</div><div><b>Execution creates value</b>Tracked to completion</div></div>
 <div class="grid g4" style="margin-bottom:16px">${kpis.map((k,i)=>`<div class="card kpi hov up" style="--i:${i+2}"><div class="lab">${k[0]}</div><div class="num ${k[2]}">${k[1]==null?'—':count(k[1],k[0]==='Client improvement'?'signed':'')}${k[0]==='Client improvement'&&k[1]!=null?'<small style="font-size:14px;color:var(--muted)"> pts</small>':''}</div><div class="foot">${k[3]}</div></div>`).join('')}</div>
 <section class="panel up" style="--i:6;margin-bottom:16px"><div class="ph"><div><h2>Engagement pipeline</h2><p>Where each client stands across the five-stage engagement model</p></div><button class="link" data-act="go" data-p="clients">All clients →</button></div>
 <div class="pipe">${STAGES.map((s,i)=>{const cs=C.filter((c,j)=>stages[j]===i);return `<div class="lane"><h4>${s}<span>${cs.length}</span></h4>${cs.map(c=>{const l=latestScored(c);const sc=l?score(l).overall:null;return `<button class="cchip" data-act="openClient" data-id="${c.id}"><b>${esc(c.name)}</b><small>${esc(c.industry||'')}</small>${sc!=null?`<div style="display:flex;gap:8px;align-items:center;margin-top:6px">${bar(sc,scls(sc),'thin')}<small>${sc}</small></div>`:''}</button>`}).join('')||'<p class="tiny muted">No clients</p>'}</div>`}).join('')}</div></section>
 <div class="grid g-main"><section class="panel up" style="--i:7"><div class="ph"><div><h2>Portfolio health by category</h2><p>Average of each client’s latest Business Health score</p></div>${pill('auto','Automated')}</div>${catAvg.map(c=>`<div class="catrow"><span>${esc(c.short)}</span>${bar(c.v,scls(c.v))}<b>${c.v??'—'}</b></div>`).join('')}</section>
 <section class="panel up" style="--i:8"><div class="ph"><div><h2>Review queue</h2><p>Oldest first</p></div></div>${queue.length?queue.map(a=>{const c=client(a.clientId),rc=reviewCounts(a),tot=allF(a).length;return `<div class="contact"><div style="flex:1"><button class="link" data-act="openReview" data-id="${a.id}">${esc(c?.name)}</button><div class="tiny muted">${esc(a.title)} · scored ${fdate(a.submittedAt)}</div>${bar(tot?(tot-rc.pending)/tot*100:0,'','thin')}</div>${statusPill(a)}</div>`}).join(''):'<div class="empty">Queue is clear.</div>'}
 <h3 style="margin:18px 0 6px">Recent activity</h3><div class="hist">${db.log.slice(0,6).map(l=>`<div>${esc(l.what)}<small>${esc(l.who)} · ${ftime(l.at)}</small></div>`).join('')}</div></section></div>`}

function vClients(){if(state.clientId&&client(state.clientId))return vClient(client(state.clientId));const q=state.q.toLowerCase();const list=db.clients.filter(c=>!q||(c.name+' '+c.industry+' '+c.location).toLowerCase().includes(q));
 return head('Clients','Client workspaces',`${db.clients.length} clients. Each workspace holds company details, contacts, assessment history, action plans and reports.`,`<input class="search" type="search" placeholder="Search clients" value="${esc(state.q)}" data-in="search" aria-label="Search clients"><button class="btn" data-act="newClient">＋ New client</button>`)+
 (list.length?`<div class="grid g3">${list.map((c,i)=>{const l=latestScored(c),s=l?score(l):null,st=stageOf(c),open=db.recs.filter(r=>r.clientId===c.id&&r.status!=='Complete').length;return `<button class="card hov ccard up" style="--i:${i}" data-act="openClient" data-id="${c.id}"><div class="top2">${ring(s?.overall??null,64,6,'','sm')}<div><h3>${esc(c.name)}</h3><div class="small muted">${esc(c.industry)} · ${esc(c.location)}</div></div></div>${minirail(st)}<div class="statline small"><span class="muted">${STAGES[st]}</span><span>${open} open action${open===1?'':'s'}</span></div></button>`}).join('')}</div>`:`<div class="panel empty"><b>No clients match “${esc(state.q)}”</b>Try a different name or industry.</div>`)}
function vClient(c){const st=stageOf(c),as=db.assessments.filter(a=>a.clientId===c.id).sort((x,y)=>String(y.date).localeCompare(String(x.date))),recs=db.recs.filter(r=>r.clientId===c.id);const l=latestScored(c),s=l?score(l):null,p=l?prevOf(l):null;
 const tabs=[['overview','Overview'],['assessments',`Assessments (${as.length})`],['plan',`Action plan (${recs.length})`],['reports','Reports'],['notes','Notes & documents']];
 let body='';
 if(state.ctab==='overview')body=`<div class="grid g-main"><div class="grid"><section class="panel"><div class="ph"><h2>Company information</h2><button class="btn ghost sm" data-act="editClient" data-id="${c.id}">Edit</button></div><dl class="kv"><dt>Industry</dt><dd>${esc(c.industry)||'—'}</dd><dt>Size</dt><dd>${esc(c.size)||'—'}</dd><dt>Location</dt><dd>${esc(c.location)||'—'}</dd><dt>Website</dt><dd>${esc(c.website)||'—'}</dd><dt>Client since</dt><dd>${fdate(c.since)}</dd><dt>Engagement stage</dt><dd>${STAGES[st]}</dd></dl></section>
 <section class="panel"><div class="ph"><h2>Contacts</h2><button class="btn ghost sm" data-act="addContact" data-id="${c.id}">＋ Add contact</button></div>${(c.contacts||[]).map((x,i)=>`<div class="contact"><div class="avatar">${esc((x.name||'?')[0])}</div><div style="flex:1"><b>${esc(x.name)}</b><div class="small muted">${esc(x.role)}</div></div><div class="small" style="text-align:right">${esc(x.email)}<br><span class="muted">${esc(x.phone)}</span></div><button class="x" data-act="delContact" data-id="${c.id}" data-i="${i}" aria-label="Remove contact">×</button></div>`).join('')||'<p class="muted small">No contacts yet.</p>'}</section></div>
 <div class="grid"><section class="panel"><div class="ph"><h2>Latest results</h2>${l?statusPill(l):''}</div>${l?`<div class="stat">${ring(s.overall,120,10,'/ 100')}<div class="stack3"><div class="statline"><span class="muted">Screening band</span><b>${esc(s.band)}</b></div><div class="statline"><span class="muted">Data completeness</span><b>${s.completeness}%</b></div><div class="statline"><span class="muted">Confidence</span><b>${s.confLevel}</b></div>${p?`<div class="statline"><span class="muted">Change since ${fdate(p.date)}</span><b class="delta ${s.overall-score(p).overall>0?'up':'down'}">${s.overall-score(p).overall>0?'+':''}${s.overall-score(p).overall} pts</b></div>`:''}</div></div>`:'<p class="muted">No scored assessment yet.</p>'}</section>
 <section class="panel"><div class="ph"><h2>Engaged services</h2><label class="check"><input type="checkbox" data-chg="advisory" data-id="${c.id}" ${c.advisory?'checked':''}>Ongoing advisory</label></div><div class="grid" style="gap:6px">${db.services.filter(v=>v.active).map(v=>`<label class="check"><input type="checkbox" data-chg="clientSvc" data-id="${c.id}" data-s="${v.id}" ${(c.services||[]).includes(v.id)?'checked':''}>${esc(v.name)} <span class="tiny muted">${esc(v.model)}</span></label>`).join('')}</div></section></div></div>`;
 if(state.ctab==='assessments')body=`<div class="grid g-main"><section class="panel"><div class="ph"><h2>Assessment history</h2><div class="btns">${l?`<button class="btn ghost sm" data-act="reassess" data-id="${c.id}">Start reassessment</button>`:''}<button class="btn sm" data-act="newAssess" data-c="${c.id}">＋ New assessment</button></div></div>${aTable(as,false)}</section><section class="panel"><div class="ph"><h2>Initial vs. latest</h2>${pill('auto','Automated scores')}</div>${l&&p?compare(score(l).cats,score(p).cats):'<p class="muted small">A comparison appears once the client has two scored assessments on the same template.</p>'}</section></div>`;
 if(state.ctab==='plan')body=recs.length?roadmap(recs):`<div class="panel empty"><b>No action plan yet</b>Recommendations are generated after an expert approves the assessment.</div>`;
 if(state.ctab==='reports')body=`<section class="panel">${as.filter(a=>a.status!=='draft').map(a=>`<div class="contact"><div style="flex:1"><b>${esc(a.title)}</b><div class="small muted">${fdate(a.date)} · ${esc(tpl(a.templateId).name)}</div></div>${statusPill(a)}<button class="btn ghost sm" data-act="openReport" data-id="${a.id}">Open report</button></div>`).join('')||'<p class="muted">Reports are available after the automated assessment runs.</p>'}</section>`;
 if(state.ctab==='notes')body=`<div class="grid g2"><section class="panel"><h2 style="margin-bottom:10px">Engagement notes</h2><textarea data-chg="cnotes" data-id="${c.id}" style="min-height:200px">${esc(c.notes||'')}</textarea><p class="hint" style="margin-top:6px">Saved when you leave the field.</p></section><section class="panel"><div class="ph"><h2>Supporting documents</h2><label class="btn ghost sm" style="cursor:pointer">＋ Attach<input type="file" data-chg="cdoc" data-id="${c.id}" hidden multiple></label></div><div class="notice blue" style="margin-bottom:10px">Prototype: only the file name and date are recorded. File contents are not stored or uploaded.</div>${(c.docs||[]).map((d,i)=>`<div class="contact"><div style="flex:1"><b class="small">${esc(d.name)}</b><div class="tiny muted">${esc(d.kind||'Document')} · added ${fdate(d.added)}</div></div><button class="x" data-act="delDoc" data-id="${c.id}" data-i="${i}" aria-label="Remove">×</button></div>`).join('')||'<p class="muted small">No documents recorded.</p>'}</section></div>`;
 return `<div class="head up"><div><button class="link small" data-act="go" data-p="clients">← All clients</button><h1 style="margin-top:8px">${esc(c.name)}</h1><p class="sub">${esc(c.industry)} · ${esc(c.size)} · ${esc(c.location)}${c.sample?' · <span class="tiny">fictional sample client</span>':''}</p></div><div class="btns"><button class="btn ghost" data-act="delClient" data-id="${c.id}">Delete</button>${l?`<button class="btn ghost" data-act="openReport" data-id="${l.id}">Latest report</button>`:''}<button class="btn" data-act="newAssess" data-c="${c.id}">＋ New assessment</button></div></div>
 <section class="panel up" style="--i:1;margin-bottom:18px">${rail(st)}</section>
 <div class="tabs up" style="--i:2">${tabs.map(t=>`<button class="${state.ctab===t[0]?'on':''}" data-act="ctab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div><div class="up" style="--i:3">${body}</div>`}

function aTable(list,showClient=true){if(!list.length)return '<div class="empty"><b>No assessments yet</b>Start one to run the automated triage.</div>';
 return `<div class="scroll"><table class="stack"><thead><tr><th>Assessment</th>${showClient?'<th>Client</th>':''}<th>Template</th><th>Date</th><th class="num">Score</th><th>Confidence</th><th>Status</th></tr></thead><tbody>${list.map(a=>{const s=score(a),c=client(a.clientId);return `<tr><td><button class="link" data-act="openAssess" data-id="${a.id}">${esc(a.title)}</button></td>${showClient?`<td>${esc(c?.name)}</td>`:''}<td class="small muted">${esc(tpl(a.templateId).name)}</td><td class="small">${fdate(a.date)}</td><td class="num"><b class="${''}">${s.overall??'—'}</b></td><td>${a.status==='draft'?'<span class="muted small">—</span>':pill(s.confLevel==='High'?'green':s.confLevel==='Moderate'?'blue':'amber',s.confLevel)}</td><td>${statusPill(a)}</td></tr>`}).join('')}</tbody></table></div>`}
function vAssessments(){if(state.mode==='new')return vSetup();if(state.aid&&asmt(state.aid)){const a=asmt(state.aid);return state.mode==='wizard'&&a.status==='draft'?vWizard(a):vAssess(a)}
 const F=[['all','All'],['draft','Drafts'],['submitted','Awaiting review'],['in-review','In review'],['approved','Approved']];const list=db.assessments.filter(a=>state.afilter==='all'||a.status===state.afilter).sort((x,y)=>String(y.updated).localeCompare(String(x.updated)));
 return head('Assessments','Assessment workspace','Automated assessments score each category, measure data completeness and confidence, and raise findings for expert validation.',`<button class="btn" data-act="newAssess">＋ New assessment</button>`)+`<div class="tabs up" style="--i:1">${F.map(f=>`<button class="${state.afilter===f[0]?'on':''}" data-act="afilter" data-f="${f[0]}">${f[1]} <span class="muted">${f[0]==='all'?db.assessments.length:db.assessments.filter(a=>a.status===f[0]).length}</span></button>`).join('')}</div><section class="panel up" style="--i:2">${aTable(list)}</section>`}
function vSetup(){return head('New assessment','Start an assessment','Choose the client and the assessment template. Templates are configurable in Administration.')+`<form class="panel up" style="--i:1;max-width:760px" data-sub="createA"><div class="form"><div class="f full"><label for="sc">Client</label><select id="sc" name="clientId" required>${db.clients.map(c=>`<option value="${c.id}" ${state.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><span class="hint">New client? <button type="button" class="link" data-act="newClient">Create one first</button></span></div><div class="f full"><label for="st">Template</label><select id="st" name="templateId">${db.templates.map(t=>`<option value="${t.id}">${esc(t.name)} · v${esc(t.version)}</option>`).join('')}</select></div><div class="f"><label for="sti">Assessment title</label><input id="sti" name="title" required value="Initial business health assessment"></div><div class="f"><label for="sd">Assessment date</label><input id="sd" name="date" type="date" value="${today()}"></div></div><div class="actions"><button class="btn" type="submit">Create draft &amp; begin</button><button class="btn ghost" type="button" data-act="go" data-p="assessments">Cancel</button></div></form>`}

function vReviews(){if(state.aid&&asmt(state.aid))return vReview(asmt(state.aid));const L=db.assessments.filter(a=>a.status!=='draft');const g=[['submitted','Pending validation'],['in-review','In progress'],['approved','Approved']];

function roadmap(recs){const tot=recs.length,done=recs.filter(r=>r.status==='Complete').length,prog=recs.filter(r=>r.status==='In progress').length,blk=recs.filter(r=>r.status==='Blocked').length;const pct=tot?Math.round(done/tot*100):0;
 const recCard=r=>{const c=client(r.clientId),ov=r.status!=='Complete'&&r.due&&r.due<today();return `<div class="rec ${r.status==='Complete'?'done':''}"><div style="display:flex;gap:6px;flex-wrap:wrap">${pill(r.priority==='High'?'red':r.priority==='Medium'?'amber':'blue',r.priority||'—')}${r.effort?pill('','Effort: '+r.effort):''}${ov?pill('red','Overdue'):''}</div><b class="t">${esc(r.title)}</b>${state.planClient==='all'&&state.page==='plans'?`<div class="tiny muted">${esc(c?.name)}</div>`:''}${r.fin?`<div class="tiny" style="color:#86c8ff;margin-top:4px" data-tip="${esc(r.finAssumptions)}">Est. impact ${money(r.fin)} · see assumptions</div>`:''}${r.assessmentId&&asmt(r.assessmentId)?`<div class="tiny muted" style="margin-top:4px">From: ${esc(asmt(r.assessmentId).title)}</div>`:''}<div class="meta"><span>${esc(r.owner||'Unassigned')}</span><span>Due ${fdate(r.due)}</span></div><div style="display:flex;gap:6px;align-items:center"><select data-chg="recStatus" data-id="${r.id}" aria-label="Status">${RSTAT.map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn ghost sm" style="margin-top:8px" data-act="editRec" data-id="${r.id}">Edit</button></div></div>`};
 return `<div class="grid g4" style="margin-bottom:16px"><div class="card kpi"><div class="stat">${ring(pct,76,7,'','sm')}<div><div class="lab">Plan completion</div><div class="foot">${done} of ${tot} complete</div></div></div></div><div class="card kpi"><div class="lab">In progress</div><div class="num amber">${count(prog)}</div></div><div class="card kpi"><div class="lab">Blocked</div><div class="num ${blk?'red':''}">${count(blk)}</div></div><div class="card kpi"><div class="lab">Est. impact in plan</div><div class="num" style="font-size:24px">${money(recs.reduce((x,r)=>x+(+r.fin||0),0))}</div><div class="foot">Sum of estimates; assumptions on each card</div></div></div>
 <div class="tabs"><button class="${state.planView==='roadmap'?'on':''}" data-act="pview" data-v="roadmap">Roadmap</button><button class="${state.planView==='timeline'?'on':''}" data-act="pview" data-v="timeline">Milestone timeline</button></div>
 ${state.planView==='roadmap'?`<div class="roadmap">${HZ.map(([k,n,d])=>{const l=recs.filter(r=>r.horizon===k).sort((x,y)=>String(x.due).localeCompare(String(y.due)));const dn=l.filter(r=>r.status==='Complete').length;return `<div class="col"><h3>${n}<span class="tiny muted">${dn}/${l.length}</span></h3><p>${d}</p>${bar(l.length?dn/l.length*100:0,'green','thin')}<div style="height:10px"></div>${l.map(recCard).join('')||'<p class="tiny muted">No actions in this horizon.</p>'}</div>`}).join('')}</div>`:
 `<section class="panel"><div class="tl">${recs.slice().sort((x,y)=>String(x.due).localeCompare(String(y.due))).map((r,i)=>`<div class="tli ${r.status==='In progress'?'prog':r.status} up" style="--i:${i}"><div class="d">${fdate(r.due)}</div><b>${esc(r.title)}</b> ${pill(r.status==='Complete'?'green':r.status==='Blocked'?'red':r.status==='In progress'?'amber':'',r.status)}<div class="small muted">${esc(client(r.clientId)?.name)} · ${esc(r.owner||'Unassigned')} · ${esc((HZ.find(h=>h[0]===r.horizon)||[])[1]||'')}</div></div>`).join('')}</div></section>`}`}
function vPlans(){const recs=db.recs.filter(r=>state.planClient==='all'||r.clientId===state.planClient);const cl=db.clients.filter(c=>db.recs.some(r=>r.clientId===c.id));
 return head('Action plans','Strategic action plans','Validated findings become owned, dated actions grouped into 0–30 day, 30–90 day, 3–6 month and 6–12 month horizons.',`<select data-chg="planClient" aria-label="Filter by client" style="width:auto">${['<option value="all">All clients</option>',...cl.map(c=>`<option value="${c.id}" ${state.planClient===c.id?'selected':''}>${esc(c.name)}</option>`)].join('')}</select><button class="btn" data-act="addRec">＋ Add action</button>`)+(recs.length?`<div class="up" style="--i:1">${roadmap(recs)}</div>`:`<div class="panel empty"><b>No actions yet</b>Approve an expert review, then generate its action plan.</div>`)}

function vReports(){const L=db.assessments.filter(a=>a.status!=='draft').sort((x,y)=>String(y.date).localeCompare(String(x.date)));if(!L.length)return head('Reports','Executive reports','')+'<div class="panel empty"><b>No reports yet</b>Reports are available once an assessment has been scored.</div>';
 const a=asmt(state.reportId)||L[0];state.reportId=a.id;
 return `<div class="head up noprint"><div><div class="kick">Executive reporting</div><h1>Executive report</h1><p class="sub">Branded, printable report for owners and leadership teams.</p></div><div class="btns"><select data-chg="reportPick" aria-label="Choose assessment" style="width:auto;max-width:320px">${L.map(x=>`<option value="${x.id}" ${x.id===a.id?'selected':''}>${esc(client(x.clientId)?.name)} — ${esc(x.title)}</option>`).join('')}</select><button class="btn ghost" data-act="copyReport">Copy text</button><button class="btn" data-act="print">Print / Save PDF</button></div></div><div class="up" style="--i:1">${report(a)}</div>`}
function report(a){const t=tpl(a.templateId),c=client(a.clientId)||{},s=score(a),p=prevOf(a),ps=p?score(p):null,F=allF(a),approved=a.status==='approved';
 const kept=F.filter(f=>fstate(a,f)!=='rejected').map(f=>({f,e:eff(a,f),st:fstate(a,f)})).sort((x,y)=>SEVO[x.e.sev]-SEVO[y.e.sev]);const rej=F.filter(f=>fstate(a,f)==='rejected');
 const recs=db.recs.filter(r=>r.assessmentId===a.id).sort((x,y)=>({High:0,Medium:1,Low:2}[x.priority]??3)-({High:0,Medium:1,Low:2}[y.priority]??3));
 const strengths=s.cats.filter(x=>x.score>=70).map(x=>x.name);const weak=s.cats.filter(x=>x.score!=null).sort((x,y)=>x.score-y.score).slice(0,3);
 const ests=kept.filter(k=>k.f.est);
 const svc=id=>db.services.find(v=>v.id===id);const next=[];if(recs.some(r=>r.status!=='Complete'))next.push(['svc-4','Support execution of the open high-priority actions in the first 30 days.']);next.push(['svc-5','Monthly progress reviews against the action plan and a reassessment in about 90 days to measure change.']);if(s.cats.some(x=>['tech','cyber','auto','ai'].includes(x.id)&&x.score!=null&&x.score<60))next.push(['svc-6','Targeted technology, cybersecurity, automation and AI work where those categories scored below 60.']);
 const lab=st=>st==='validated'?pill('exp','Automated · expert-validated'):st==='modified'?pill('amber','Modified by expert'):st==='expert'?pill('exp','Expert-added'):pill('auto','Automated · not yet validated');
 const sec=(n,title)=>`<h3><span>${String(n).padStart(2,'0')}</span>${title}</h3>`;
 return `<article class="paper" id="report"><div class="rhead"><div><div class="rbrand"><div class="mark" style="width:30px;height:30px;font-size:13px">AP</div>${esc(db.settings.firm)}</div><h2 style="margin-top:14px">${esc(c.name)}</h2><p class="muted" style="margin:4px 0 0">${esc(a.title)} · ${esc(t.name)} · ${fdate(a.date)}</p></div><div style="text-align:right">${approved?`<span class="pill green">Expert-approved ${fdate(a.review.approvedAt)}</span>`:'<span class="draftmark">DRAFT — expert review not complete</span>'}<p class="muted small" style="margin-top:8px">Prepared by ${esc(db.settings.firm)}${c.sample?'<br>Fictional sample client':''}</p></div></div>
 <div class="rgridstats"><div><small>Overall score</small><b>${s.overall??'—'} / 100</b></div><div><small>Screening band</small><b>${esc(s.band)}</b></div><div><small>Data completeness</small><b>${s.completeness}%</b></div><div><small>Confidence</small><b>${s.confLevel}</b></div></div>
 ${sec(1,'Executive summary')}<p>${esc(c.name)} scored <b>${s.overall}</b> out of 100 on the ${esc(t.name)}, placing it in the “${esc(s.band)}” band${p?`, ${s.overall-ps.overall>=0?'up':'down'} ${Math.abs(s.overall-ps.overall)} points from ${fdate(p.date)}`:''}. ${strengths.length?`Strengths: ${esc(strengths.join(', '))}. `:''}The weakest areas are ${esc(weak.map(x=>x.name+' ('+x.score+')').join(', '))}. ${kept.filter(k=>k.e.sev==='high').length} high-priority findings ${approved?'were confirmed by expert review':'are awaiting expert validation'}.</p>${a.review.summary?`<p><b>Expert view:</b> ${esc(a.review.summary)}</p>`:''}${a.review.recommendation?`<p><b>Recommendation:</b> ${esc(a.review.recommendation)}</p>`:''}
 ${sec(2,'Business profile')}<table><tbody><tr><td class="muted" style="width:38%">Industry</td><td>${esc(c.industry)}</td></tr><tr><td class="muted">Size</td><td>${esc(c.size)}</td></tr><tr><td class="muted">Location</td><td>${esc(c.location)}</td></tr>${t.profile.filter(f=>a.profile[f.k]!==''&&a.profile[f.k]!=null).map(f=>`<tr><td class="muted">${esc(f.l)}</td><td>${fmtVal(f,a.profile[f.k])}</td></tr>`).join('')}</tbody></table><p class="muted small" style="margin-top:6px">Profile figures are ${a.profileVerified?'verified against source documents':'client-provided and not independently verified'}.</p>
 ${sec(3,'Assessment methodology')}<p>${esc(t.description)} Each input is rated 1 (weak or unsupported) to 5 (strong or evidenced) and tagged by source: verified, client-provided, or assumption. Category scores are the average rating as a share of the maximum; the overall score is the weighted average of scored categories. Data completeness is the share of inputs answered. Confidence combines completeness with source quality (verified 100%, client-provided 70%, assumption 35%).</p><p>Template v${esc(a.templateVersion||t.version)} · scoring methodology v${esc(a.methodology||METHOD)} · finding thresholds: high at or below ${a.thresholds?.high??t.thresholds.high}, medium at or below ${a.thresholds?.medium??t.thresholds.medium}. The score is a screening signal, not a definitive judgment about the business. Every automated finding is reviewed by an expert, who may validate, modify or reject it.</p>
 ${sec(4,'Overall assessment results')}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;align-items:center"><div class="stat">${ring(s.overall,140,12,'/ 100')}<div class="stack3 small"><div class="statline"><span class="muted">Inputs answered</span><b>${s.answered} / ${s.total}</b></div><div class="statline"><span class="muted">Confidence index</span><b>${s.confidence}</b></div><div class="statline"><span class="muted">Findings reviewed</span><b>${F.length-reviewCounts(a).pending} / ${F.length}</b></div></div></div>${radar(s.cats,ps?ps.cats.map(x=>x.score):null)}</div>
 ${sec(5,'Category-by-category analysis')}<div class="scroll"><table class="stack"><thead><tr><th>Category</th><th class="num">Score</th>${ps?'<th class="num">Change</th>':''}<th class="num">Complete</th><th>Signal</th></tr></thead><tbody>${s.cats.map(x=>{const pv=ps?.cats.find(y=>y.id===x.id)?.score;const d=x.score!=null&&pv!=null?x.score-pv:null;return `<tr><td>${esc(x.name)}</td><td class="num"><b>${x.score??'—'}</b></td>${ps?`<td class="num">${d==null?'—':(d>0?'+':'')+d}</td>`:''}<td class="num">${Math.round(x.comp*100)}%</td><td>${x.score==null?pill('','Not assessed'):x.score>=70?pill('green','Strength'):x.score>=55?pill('blue','Moderate'):pill('red','Gap')}</td></tr>`}).join('')}</tbody></table></div>
 ${sec(6,'Critical findings')}${kept.map(k=>`<div class="fd"><div class="fh"><span class="sev ${k.e.sev}"></span>${sevPill(k.e.sev)}${lab(k.st)}</div><h4>${esc(k.e.title)}</h4><p>${esc(k.e.detail)}</p>${k.st==='modified'?`<p class="small muted" style="margin-top:4px">Original automated finding: “${esc(k.f.title)}”. Changed because: ${esc(a.review.items[k.f.id].rationale)}</p>`:''}</div>`).join('')||'<p>No findings.</p>'}${rej.length?`<p class="small muted" style="margin-top:10px"><b>Automated observations rejected by the expert:</b> ${rej.map(f=>`${esc(f.title)} (${esc(a.review.items[f.id].rationale)})`).join('; ')}.</p>`:''}
 ${sec(7,'Financial and operational implications')}${ests.length?ests.map(k=>`<div class="est" style="margin-bottom:8px"><span class="small">${esc(k.f.est.label)}</span><br><b>${money(k.f.est.value)}</b> <span class="small muted">estimate</span><ul>${k.f.est.assumptions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join(''):'<p>No financial estimates are supportable from the data provided.</p>'}${kept.filter(k=>k.e.sev==='high').length?`<p style="margin-top:10px"><b>Operational implications:</b> ${esc([...new Set(kept.filter(k=>k.e.sev==='high').map(k=>t.categories.find(x=>x.id===k.e.cat)?.impact).filter(Boolean))].join(' '))}</p>`:''}
 ${sec(8,'Expert observations')}${a.review.summary?`<p>${esc(a.review.summary)}</p>`:'<p class="muted">Expert observations have not been entered yet.</p>'}${a.review.missing?`<p><b>Information still needed:</b> ${esc(a.review.missing)}</p>`:''}<p class="muted small">Reviewer: ${esc(a.review.reviewer||rev())}${approved?` · approved ${fdate(a.review.approvedAt)}`:' · review in progress'}</p>
 ${sec(9,'Prioritized recommendations')}${recs.length?`<div class="scroll"><table class="stack"><thead><tr><th>#</th><th>Recommendation</th><th>Priority</th><th>Effort</th><th>Owner</th><th>Expected outcome</th></tr></thead><tbody>${recs.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.title)}</b><div class="small muted">${esc(r.problem)}</div></td><td>${pill(r.priority==='High'?'red':r.priority==='Medium'?'amber':'blue',r.priority)}</td><td>${esc(r.effort||'—')}</td><td>${esc(r.owner||'To assign')}</td><td class="small">${esc(r.outcome)}</td></tr>`).join('')}</tbody></table></div>`:`<p class="muted">${approved?'Generate the action plan from the expert review to populate recommendations.':'Recommendations are produced after expert approval.'}</p>`}
 ${sec(10,'Strategic action plan')}${recs.length?HZ.map(([k,n,d])=>{const l=recs.filter(r=>r.horizon===k);return l.length?`<p style="margin-top:10px"><b>${n}</b> <span class="muted">(${d})</span></p><table><tbody>${l.map(r=>`<tr><td>${esc(r.title)}<div class="small muted">Measure: ${esc(r.measure||'—')}</div></td><td class="num small">${fdate(r.due)}</td><td>${pill(r.status==='Complete'?'green':r.status==='In progress'?'amber':'',r.status)}</td></tr>`).join('')}</tbody></table>`:''}).join(''):'<p class="muted">No action plan yet.</p>'}
 ${sec(11,'Proposed next steps')}<ol style="margin:0;padding-left:20px">${next.map(([id,txt])=>`<li style="margin-bottom:6px"><b>${esc(svc(id)?.name||'')}</b> — ${esc(txt)}</li>`).join('')}</ol>
 <div class="foot">Prepared by ${esc(db.settings.firm)}. Automated findings are based solely on information entered and are labeled as such. Expert conclusions and final business decisions remain the responsibility of the designated reviewer and the client’s leadership. Financial figures are estimates; their assumptions are listed beside each one.</div></article>`}

function vServices(){return head('Service catalog','Service catalog','The engagements APP Strategies offers, from one-time diagnostics to recurring advisory. Pricing is left blank on purpose — define it here when ready.',`<button class="btn" data-act="editSvc">＋ Add service</button>`)+`<section class="panel up" style="--i:1"><div class="scroll"><table class="stack"><thead><tr><th>Service</th><th>Engagement model</th><th>Pricing</th><th class="num">Clients</th><th>Status</th><th></th></tr></thead><tbody>${db.services.map(v=>`<tr><td><b>${esc(v.name)}</b><div class="small muted">${esc(v.desc)}</div></td><td>${pill(v.model==='Recurring'?'blue':'',v.model)}</td><td>${v.price?`<b>${esc(v.price)}</b> <span class="small muted">${esc(v.unit)}</span>`:'<span class="muted small">To be defined</span>'}</td><td class="num">${db.clients.filter(c=>(c.services||[]).includes(v.id)).length}</td><td>${v.active?pill('green','Active'):pill('','Inactive')}</td><td><button class="btn ghost sm" data-act="editSvc" data-id="${v.id}">Edit</button></td></tr>`).join('')}</tbody></table></div></section>`}
function vAdmin(){const S=db.settings;const sec=[['Secure authentication','Not implemented','No sign-in; anyone with this page can use it.'],['Role-based access control','Not implemented','Reviewer name is a display setting only.'],['Multi-client data separation','Not implemented','All clients share one browser data store.'],['Persistent database storage','Not implemented','Data lives in this browser’s local storage.'],['Secure document storage','Not implemented','Only file names are recorded.'],['Server-side audit logging','Partial (client-side only)','A change history is kept in the browser; it is not tamper-proof.'],['Assessment version control','Partial','Answers lock on submission; reassessments create new versions.'],['Scoring methodology versioning','Partial','Each assessment stores its template version, weights and methodology version.'],['Backup and recovery','Manual only','Use Export data below.'],['Secure API integrations','Not implemented','No external integrations.']];
 return head('Administration','Administration','Reviewer settings, assessment templates, scoring methodology, data management and the security status of this prototype.')+
 `<div class="grid g2" style="margin-bottom:16px"><form class="panel up" style="--i:1" data-sub="settings"><h2 style="margin-bottom:12px">Settings</h2><div class="form"><div class="f"><label for="s1">Expert reviewer name</label><input id="s1" name="reviewer" value="${esc(S.reviewer)}"></div><div class="f"><label for="s2">Firm name (on reports)</label><input id="s2" name="firm" value="${esc(S.firm)}"></div><div class="f"><label for="s3">Loaded labor rate ($/hour)</label><input id="s3" name="rate" type="number" min="0" value="${S.rate}"></div><div class="f"><label for="s4">Automatable share of time (%)</label><input id="s4" name="autoShare" type="number" min="0" max="100" value="${S.autoShare}"></div><div class="f"><label for="s5">Operations inefficiency share (%)</label><input id="s5" name="opsShare" type="number" min="0" max="100" value="${S.opsShare}"></div></div><p class="hint" style="margin-top:8px">Estimate assumptions apply to assessments submitted after the change.</p><div class="actions"><button class="btn" type="submit">Save settings</button></div></form>
 <section class="panel up" style="--i:2"><h2 style="margin-bottom:6px">Security &amp; production readiness</h2><p class="small muted" style="margin-bottom:10px">This is a prototype. It does not provide production security or multi-tenant isolation.</p><div class="scroll"><table class="stack"><thead><tr><th>Requirement</th><th>Status</th></tr></thead><tbody>${sec.map(r=>`<tr><td><b class="small">${r[0]}</b><div class="tiny muted">${r[2]}</div></td><td>${pill(r[1].startsWith('Not')?'red':'amber',r[1])}</td></tr>`).join('')}</tbody></table></div></section></div>
 <section class="panel up" style="--i:3;margin-bottom:16px"><div class="ph"><div><h2>Assessment templates</h2><p>Weights and thresholds are stamped onto each assessment when it is submitted, so changing them never rewrites past results.</p></div>${pill('blue','Methodology v'+METHOD)}</div>${db.templates.map(t=>`<details ${t.id==='tpl-biz'?'open':''} style="border-top:1px solid var(--line);padding-top:12px;margin-top:12px"><summary style="font-size:15px">${esc(t.name)} · v${esc(t.version)} · ${t.categories.length} categories · ${t.rules.length} rules</summary><div class="dbody"><p class="muted" style="margin-bottom:10px">${esc(t.description)}</p><div class="form" style="grid-template-columns:repeat(2,minmax(0,1fr));max-width:420px;margin-bottom:12px"><div class="f"><label>High-severity at or below</label><input type="number" min="0" max="100" value="${t.thresholds.high}" data-chg="tth" data-t="${t.id}" data-k="high"></div><div class="f"><label>Medium-severity at or below</label><input type="number" min="0" max="100" value="${t.thresholds.medium}" data-chg="tth" data-t="${t.id}" data-k="medium"></div></div><div class="scroll"><table class="stack"><thead><tr><th>Category</th><th>Inputs</th><th class="num">Weight</th></tr></thead><tbody>${t.categories.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td class="small muted">${c.q.map(q=>esc(q.t)).join(' · ')}</td><td class="num"><input type="number" min="0" max="5" step="0.5" value="${c.weight}" data-chg="tw" data-t="${t.id}" data-c="${c.id}" style="width:80px;text-align:right" aria-label="Weight for ${esc(c.name)}"></td></tr>`).join('')}</tbody></table></div><p class="small" style="margin-top:10px"><b>Rules:</b> ${t.rules.map(r=>esc(r.title)).join(' · ')}</p></div></details>`).join('')}</section>
 <div class="grid g2"><section class="panel up" style="--i:4"><h2 style="margin-bottom:10px">Data management</h2><p class="small muted" style="margin-bottom:12px">Back up or move data between browsers. Reset restores the fictional sample portfolio.</p><div class="btns"><button class="btn ghost" data-act="exportData">Export data</button><button class="btn ghost" data-act="importData">Import data</button><button class="btn bad" data-act="resetData">Reset sample data</button></div></section>

const VIEWS={dashboard:vDashboard,clients:vClients,assessments:vAssessments,reviews:vReviews,plans:vPlans,reports:vReports,services:vServices,admin:vAdmin};
